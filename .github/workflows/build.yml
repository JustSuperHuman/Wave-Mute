name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test WaveMute.sln -c Release --nologo
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          ./scripts/Build-Release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: WaveMute-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts -File | Where-Object Extension -in '.zip', '.sha256' | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Wave Mute $env:GITHUB_REF_NAME" --generate-notes
